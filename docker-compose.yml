version: '3.8'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vendor-mssql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStr0ng!Pass
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStr0ng!Pass' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  vendor-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vendor-api
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mssql;Database=VendorDb;User Id=sa;Password=YourStr0ng!Pass;TrustServerCertificate=True;
      - Jwt__SecretKey=super-secret-jwt-key-minimum-32-characters-long!
    depends_on:
      mssql:
        condition: service_healthy
